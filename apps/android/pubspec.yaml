name: qwenton_commerceops
description: Android-first commerce operations and true-profit engine for Indian micro-creators and social sellers.
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0

  # State Management & Architecture
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.0.0

  # Backend & Networking
  supabase_flutter: ^2.5.0
  dio: ^5.4.3
  connectivity_plus: ^6.0.3

  # Local Persistence & Offline Sync
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.21
  path_provider: ^2.1.3
  path: ^1.9.0

  # Hardware, URLs & Sharing
  url_launcher: ^6.3.0
  image_picker: ^1.1.0
  share_plus: ^9.0.0
  file_picker: ^8.0.0
  csv: ^6.0.0

  # UI & Charts
  lucide_icons: ^0.257.0
  fl_chart: ^0.68.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.25.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  drift_dev: ^2.18.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
